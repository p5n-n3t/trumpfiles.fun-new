name: Trump Files — Auto Update Entries

concurrency:
  group: trump-files-auto-update
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      run_live:
        description: 'Required explicit confirmation to allow DB writes and Vectorize'
        required: true
        type: boolean
        default: false
      dry_run:
        description: 'Dry run (research only, no DB insert)'
        required: false
        type: boolean
        default: true
      max_entries:
        description: 'Max new entries to insert per run'
        required: false
        default: '5'

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check DB health (skip silently if quota exhausted)
        id: db_health
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          node -e "
          const { neon } = require('@neondatabase/serverless');
          const sql = neon(process.env.DATABASE_URL);
          sql\`SELECT 1\`
            .then(() => { console.log('DB: OK'); process.exit(0); })
            .catch(e => {
              if (e.message && e.message.includes('402')) {
                console.log('DB: QUOTA_EXHAUSTED — skipping run silently');
                process.exit(2);
              }
              console.log('DB: ERROR', e.message?.slice(0,80));
              process.exit(1);
            });
          " && echo "db_ok=true" >> $GITHUB_OUTPUT || (
            code=$?
            if [ $code -eq 2 ]; then
              echo "db_ok=false" >> $GITHUB_OUTPUT
              echo "Neon quota exhausted — skipping silently"
              exit 0
            fi
            exit $code
          )

      - name: Run update cycle
        if: steps.db_health.outputs.db_ok == 'true'
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          EXA_API_KEY_2: ${{ secrets.EXA_API_KEY_2 }}
          EXA_API_KEY_3: ${{ secrets.EXA_API_KEY_3 }}
          WORKER_URL: https://trumpstein.trumpstein.workers.dev
          RUN_LIVE: ${{ github.event.inputs.run_live || 'false' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
          MAX_ENTRIES: ${{ github.event.inputs.max_entries || '5' }}
        run: node scripts/auto-update.mjs
      # NOTE: Vectorize is handled INSIDE auto-update.mjs (incremental, new entries only).
      # Full reindex is in .github/workflows/reindex-vectorize.yml (manual only).
